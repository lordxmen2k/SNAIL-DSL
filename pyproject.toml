[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snail-dsl"
version = "0.4.2"
description = "Deterministic LLM pipeline DSL — compose frozen, single-pass neural primitives into typed dataflow programs with OOD-as-type, escalation, parallel fan-out, tamper-evident cost manifests, SHA-256 weight pinning, and confidence calibration."
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Tico Internet LLC"},
]
keywords = ["ai", "ml", "dsl", "frozen-models", "dataflow", "neural-networks", "pipelines", "workflows", "deterministic-ai", "typed-pipeline", "frozen-weights", "golden-tests", "escalation", "parallel", "fan-out", "tier-routing", "cost-tracking", "weight-pinning", "calibration", "ece"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25,<1",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/lordxmen2k/SNAIL-DSL"
Repository = "https://github.com/lordxmen2k/SNAIL-DSL"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
snail = "snail.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
